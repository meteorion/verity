name: verity

# Profiles
#   (default)       postgres + redis + app  — dev/API mode, no GPU needed
#   --profile obs   + litellm + langfuse    — LLM gateway + trace UI
#   --profile prod  + nginx                 — TLS edge proxy for production
#
# Quick-start (dev):   docker compose up -d
# Full production:     docker compose --profile obs --profile prod up -d

x-common: &common
  restart: unless-stopped
  networks:
    - verity-net

services:
  # ---- Layer 1: Storage (always started) ----
  postgres:
    <<: *common
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    <<: *common
    # Redis Stack adds vector search (needed for semantic cache in production).
    # Override with redis:7-alpine in dev if you skip semantic cache.
    image: redis/redis-stack:7.4.0-v3
    volumes:
      - ./volumes/redis:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  # ---- Layer 2: Optional — LLM gateway + Observability (--profile obs) ----
  litellm:
    <<: *common
    profiles: [obs]
    image: ghcr.io/berriai/litellm:main-stable
    env_file: .env
    volumes:
      - ./config/litellm.yaml:/app/config/litellm.yaml:ro
    ports:
      - "127.0.0.1:4000:4000"
    command: ["--config", "/app/config/litellm.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy

  langfuse:
    <<: *common
    profiles: [obs]
    image: langfuse/langfuse:2
    env_file: .env
    environment:
      DATABASE_URL: ${PGVECTOR_DSN}
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${JWT_SECRET}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # ---- Layer 3: Application (always started) ----
  app:
    <<: *common
    build: ./app
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/models:ro
      - ./data:/data
      - ./config:/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      # API mode (EMBEDDING_PROVIDER=api): ~10s.  Local mode: ~90s for model loading.
      start_period: ${APP_START_PERIOD:-30s}
    # GPU: uncomment when EMBEDDING_PROVIDER=local or RERANK_PROVIDER=local
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           capabilities: [gpu]

  # ---- Layer 3b: Frontends — static SPA built by Vite, served + API-proxied by nginx ----
  # Use --profile frontend to start these; omit for local Vite dev server instead.
  admin-ui:
    <<: *common
    profiles: [frontend]
    build: ./admin-ui
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      app:
        condition: service_healthy

  chat-ui:
    <<: *common
    profiles: [frontend]
    build: ./chat-ui
    ports:
      - "127.0.0.1:5174:80"
    depends_on:
      app:
        condition: service_healthy

  # ---- Layer 4: Optional — TLS edge proxy (--profile prod) ----
  # admin-ui / chat-ui now each serve their own SPA via nginx, so this edge only
  # terminates TLS and routes to those services + app (see config/nginx.conf).
  nginx:
    <<: *common
    profiles: [prod]
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy

networks:
  verity-net:
    driver: bridge
