name: verity

# P1 最小成本启动：`docker compose up -d` 只起 postgres + app。
# redis / litellm / langfuse / nginx 打了 p2 profile，P1 暂不需要；
# 需要时用 `docker compose --profile p2 up -d` 一起拉起。

x-common: &common
  restart: unless-stopped
  networks:
    - verity-net

services:
  # ---- Layer 1: Storage ----
  postgres:
    <<: *common
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # P2+ 引入：P1 会话状态走应用内存（见 doc/plan.md §3.13），语义缓存也是 P2 功能
  redis:
    <<: *common
    profiles: ["p2"]
    image: redis/redis-stack:7.4.0-v3
    volumes:
      - ./volumes/redis:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  # ---- Layer 2: LLM gateway + Observability（均为 P2+ 引入，见 doc/plan.md §3.11/§3.12）----
  # 待启用：LiteLLM 是否作为统一网关尚待确认，服务定义先保留，
  # app 目前也未真正调用它（generate_node 仍是 TODO 占位）
  litellm:
    <<: *common
    profiles: ["p2"]
    image: ghcr.io/berriai/litellm:main-stable
    env_file: .env
    volumes:
      - ./config/litellm.yaml:/app/config/litellm.yaml:ro
    ports:
      - "127.0.0.1:4000:4000"
    command: ["--config", "/app/config/litellm.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy

  # P1 用结构化日志代替，见 doc/plan.md §3.12
  langfuse:
    <<: *common
    profiles: ["p2"]
    image: langfuse/langfuse:2
    env_file: .env
    environment:
      DATABASE_URL: ${PGVECTOR_DSN}
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${JWT_SECRET}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # ---- Layer 3: Application ----
  app:
    <<: *common
    build: ./app
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/models:ro
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      # redis / litellm 未在 P1 实际调用（会话内存化、生成节点占位），
      # 依赖随对应功能落地时再加回来，见 doc/plan.md §3.13/§3.11
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      start_period: 90s   # wait for model loading
    # Uncomment to enable GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           capabilities: [gpu]

  # ---- Layer 4: Edge ----
  # P2+ 引入：P1 直接访问 app:8000 / 前端 dev server 即可，先不加反向代理/TLS 层
  nginx:
    <<: *common
    profiles: ["p2"]
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/certs:/etc/nginx/certs:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      app:
        condition: service_healthy

networks:
  verity-net:
    driver: bridge
