[project]
name = "verity"
version = "0.1.0"
description = "Enterprise RAG intelligent customer service system"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi[standard]>=0.115",
    "python-multipart>=0.0.20",
    # Orchestration
    "langgraph>=0.2",
    "langchain-core>=0.3",
    # LLM
    "anthropic>=0.40",
    "httpx>=0.28",
    # Storage
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "redis[hiredis]>=5.2",
    # Utilities
    "pydantic>=2.9",
    "python-jose[cryptography]>=3.3",   # JWT validation
]

[project.optional-dependencies]
# Local inference — required only when EMBEDDING_PROVIDER=local,
# RERANK_PROVIDER=local, or NLI_PROVIDER=local
local = [
    "FlagEmbedding>=1.3",
    "transformers>=4.48",
    "torch>=2.5",
    "sentence-transformers>=3.3",
]
# Document parsing pipeline (P1 knowledge ingestion)
# P1 uses PyMuPDF (no GPU); P2 can add marker-pdf + paddleocr for layout-aware parsing
pipeline = [
    "pymupdf>=1.24",
    "tiktoken>=0.7",
    "python-docx>=1.1",
    "markdown-it-py>=3.0",
    "openpyxl>=3.1",
]
# Observability (--profile obs)
obs = [
    "langfuse>=2.0",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
